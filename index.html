<style>
:root{--ld0:#0c0e10;--ld1:#111417;--ld2:#15191d;--ld3:#1b2025;--ld4:rgba(255,255,255,.09);--ld5:rgba(255,255,255,.16);--ld6:#eef0f2;--ld7:#a7afb8;--ld8:#6f7883;--ld9:#f0d06a;--ld10:rgba(232,197,71,.14);--ld11:#ff8591;--ld12:#86b0ff;--ld13:#5fe3ad;--ld14:#b79cff;--ld15:#36d695;--ld16:#ff6b78;--ld17:0 1px 0 rgba(255,255,255,.03) inset;--ld18:rgba(79,141,255,.08);--ld19:rgba(12,14,16,.7);--ld20:rgba(12,14,16,.78);--ld21:rgba(12,14,16,.92)}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]){--ld0:#efeee9;--ld1:#e6e4dd;--ld2:#ffffff;--ld3:#f6f5f1;--ld4:rgba(20,22,26,.12);--ld5:rgba(20,22,26,.2);--ld6:#121417;--ld7:#4a5058;--ld8:#7a818a;--ld9:#8a6a00;--ld10:rgba(232,197,71,.22);--ld11:#c8283a;--ld12:#1d5fd6;--ld13:#0f8a58;--ld14:#7c4dcc;--ld15:#0f8a58;--ld16:#c8283a;--ld17:0 1px 2px rgba(0,0,0,.06);--ld18:rgba(79,141,255,.10);--ld19:rgba(255,255,255,.55);--ld20:rgba(239,238,233,.8);--ld21:rgba(255,255,255,.92)}}
:root[data-theme=light]{--ld0:#efeee9;--ld1:#e6e4dd;--ld2:#ffffff;--ld3:#f6f5f1;--ld4:rgba(20,22,26,.12);--ld5:rgba(20,22,26,.2);--ld6:#121417;--ld7:#4a5058;--ld8:#7a818a;--ld9:#8a6a00;--ld10:rgba(232,197,71,.22);--ld11:#c8283a;--ld12:#1d5fd6;--ld13:#0f8a58;--ld14:#7c4dcc;--ld15:#0f8a58;--ld16:#c8283a;--ld17:0 1px 2px rgba(0,0,0,.06);--ld18:rgba(79,141,255,.10);--ld19:rgba(255,255,255,.55);--ld20:rgba(239,238,233,.8);--ld21:rgba(255,255,255,.92)}
:root[data-theme=dark]{--ld0:#0c0e10;--ld1:#111417;--ld2:#15191d;--ld3:#1b2025;--ld4:rgba(255,255,255,.09);--ld5:rgba(255,255,255,.16);--ld6:#eef0f2;--ld7:#a7afb8;--ld8:#6f7883;--ld9:#f0d06a;--ld10:rgba(232,197,71,.14);--ld11:#ff8591;--ld12:#86b0ff;--ld13:#5fe3ad;--ld14:#b79cff;--ld15:#36d695;--ld16:#ff6b78;--ld17:0 1px 0 rgba(255,255,255,.03) inset;--ld18:rgba(79,141,255,.08);--ld19:rgba(12,14,16,.7);--ld20:rgba(12,14,16,.78);--ld21:rgba(12,14,16,.92)}
/*
VOICE: precise, confident, a little playful — a German-engineered instrument for one learner.
IDEA: the Berlin U-Bahn network crossed with a Braun control panel: the course is "Linie A1", every unit a station.
PICTURE: a live metro map of your route with a pulsing train at your current station; everywhere else, words glow in their gender colour.
COLOUR and TYPE: Schwarz-Rot-Gold — graphite ground, gold for progress, red/blue/green for die/der/das. Jost (Futura's heir) + Inter.
LAYOUT: rail sidebar + one wide working column; phone gets a bottom bar and stacked panels.
*/
:root{color-scheme:light dark;
--bg:var(--ld0);--bg2:var(--ld1);--panel:var(--ld2);--panel2:var(--ld3);
--line:var(--ld4);--line2:var(--ld5);
--ink:var(--ld6);--ink2:var(--ld7);--ink3:var(--ld8);
--gold:#e8c547;--goldInk:var(--ld9);--goldSoft:var(--ld10);
--red:#ff5d6c;--redInk:var(--ld11);--blue:#4f8dff;--blueInk:var(--ld12);--green:#2fd18f;--greenInk:var(--ld13);--violet:var(--ld14);
--ok:var(--ld15);--bad:var(--ld16);
--shadow:var(--ld17);
--r:16px;--disp:'Jost',ui-sans-serif,system-ui,sans-serif;--body:'Inter',ui-sans-serif,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);overflow-x:clip;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
 background:radial-gradient(900px 500px at 85% -10%,var(--goldSoft),transparent 60%),radial-gradient(700px 500px at -10% 110%,var(--ld18),transparent 60%),
 linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;
 mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.35) 60%,transparent);opacity:.55}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--disp);font-weight:500;letter-spacing:-.01em;margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(32px,4.2vw,50px);font-weight:400}
h2{font-size:clamp(24px,2.6vw,32px);font-weight:450}
h3{font-size:19px;font-weight:500}
p{margin:0}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:14px}.tiny{font-size:13px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:26px;height:26px}.ic.sm{width:16px;height:16px}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:20px 14px;border-right:1px solid var(--line);background:var(--ld19);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;text-decoration:none}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:600 15px var(--disp);position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#111 0 33%,var(--red) 33% 66%,var(--gold) 66%)}
.brand b{font:500 20px var(--disp);letter-spacing:-.01em}
.brand .sub{display:block;font-size:12px;color:var(--ink3);margin-top:-2px}
.rail a.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;text-decoration:none;color:var(--ink2);font-size:15px;min-height:42px}
.rail a.nav:hover{background:var(--panel2);color:var(--ink)}
.rail a.nav.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
.rail a.nav.on .ic{color:var(--goldInk)}
.rail .sep{height:1px;background:var(--line);margin:10px 8px}
.rail .grp{font-size:12px;color:var(--ink3);padding:6px 12px 2px}
.rail .foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}.dot.warn{background:var(--gold)}.dot.bad{background:var(--bad)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px max(3vw,16px);border-bottom:1px solid var(--line);background:var(--ld20);backdrop-filter:blur(14px)}
.top .crumb{font:500 17px var(--disp);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .ic{width:16px;height:16px}
.chip.flame .ic{color:#ff8a3d}.chip.bolt .ic{color:var(--goldInk)}
.view{padding:clamp(18px,3vw,40px) max(3vw,16px) 120px;max-width:1240px;width:100%;margin:0 auto;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mobnav{display:none}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.flat{background:var(--panel2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:34px}.sec>h2{margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font-weight:500;font-size:15px;text-decoration:none;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--gold);border-color:transparent;color:#1a1400}
.btn.pri:hover{background:#f2d360}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.lg{min-height:54px;padding:0 24px;font-size:17px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--line2);background:var(--panel);flex:none}
.ibtn:hover{border-color:var(--ink3)}
.ibtn.on,.ibtn.speaking{border-color:var(--gold);color:var(--goldInk);box-shadow:0 0 0 4px var(--goldSoft)}
.ibtn.sm{width:36px;height:36px;border-radius:10px}
.mic.listening{background:var(--red);color:#fff;border-color:transparent;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.gold{background:var(--goldSoft);color:var(--goldInk);border-color:transparent}
.input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-size:17px}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--goldSoft)}
select.input{font-size:16px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s}
.kbd{font-size:12px;padding:1px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--ink3)}
.empty{padding:30px;text-align:center;color:var(--ink2);border:1px dashed var(--line2);border-radius:var(--r)}
hr.soft{border:0;height:1px;background:var(--line);margin:18px 0}

/* gender colours */
.g-m{color:var(--blueInk)}.g-f{color:var(--redInk)}.g-n{color:var(--greenInk)}.g-p{color:var(--violet)}
.art{font-weight:500}
.gbar-m{--gc:var(--blue)}.gbar-f{--gc:var(--red)}.gbar-n{--gc:var(--green)}.gbar-p{--gc:var(--violet)}.gbar-x{--gc:var(--gold)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:stretch}
.greet .clock{margin-top:12px;display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left}
.greet .clock b{font:500 18px var(--disp)}
.greet .clock small{display:block;color:var(--ink3);font-size:13px}
.today{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.tstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:500 26px var(--disp);line-height:1}
.ring .num small{display:block;font:400 12px var(--body);color:var(--ink3);margin-top:4px}
.stat{display:flex;flex-direction:column}
.stat b{font:500 28px var(--disp);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--ink3)}
.metro{margin-top:18px;padding:0;overflow:hidden}
.metro .mhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lineBadge{display:inline-grid;place-items:center;min-width:44px;height:30px;padding:0 10px;border-radius:8px;background:var(--gold);color:#1a1400;font:600 16px var(--disp)}
.mscroll{overflow-x:auto;scrollbar-width:thin}
.mfig{position:relative;height:290px;min-width:900px}
.mfig svg{position:absolute;inset:0;width:100%;height:100%}
.mfig a{cursor:pointer}
.mfig .lbl{font:500 14px var(--disp);fill:var(--ink)}
.mfig .sub{font:400 12px var(--body);fill:var(--ink3)}
.mfig .cur{animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.cta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.cta a{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);text-decoration:none;min-height:132px;transition:transform .15s,border-color .15s}
.cta a:hover{transform:translateY(-2px);border-color:var(--line2)}
.cta a.go{background:var(--ink);color:var(--bg)}
.cta a.go .faint{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.cta a b{font:500 20px var(--disp)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);text-decoration:none;position:relative;overflow:hidden;min-height:150px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--line2)}
button.tile{text-align:left;font:inherit;color:inherit;align-items:stretch}
.tile .ic{width:28px;height:28px;color:var(--tc,var(--goldInk))}
.tile b{font:500 18px var(--disp)}
.tile p{font-size:14px;color:var(--ink2)}
.tile .new{position:absolute;top:14px;right:14px}
.wotd{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.wotd .big{font:400 clamp(28px,4vw,40px)/1 var(--disp)}

/* ---------- path & unit ---------- */
.pathlist{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.pathlist::before{content:"";position:absolute;left:13px;top:20px;bottom:20px;width:4px;border-radius:4px;background:var(--line2)}
.station{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-decoration:none}
.station::before{content:"";position:absolute;left:-29px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--bg);border:4px solid var(--ink3)}
.station.done::before{background:var(--gold);border-color:var(--gold)}
.station.now::before{border-color:var(--gold);box-shadow:0 0 0 6px var(--goldSoft)}
.station:hover{border-color:var(--line2)}
.station .no{font:500 13px var(--body);color:var(--ink3)}
.station b{font:500 20px var(--disp)}
.steps{display:flex;gap:6px}
.steps i{width:10px;height:10px;border-radius:3px;background:var(--panel2);border:1px solid var(--line2)}
.steps i.on{background:var(--gold);border-color:var(--gold)}
.uhead{border-radius:20px;padding:26px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.uhead::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--uc,var(--gold))}
.tabs{display:flex;gap:6px;margin:18px 0;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.tabs button .ck{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:11px}
.tabs button .ck.y{background:var(--gold);color:#1a1400}
.wcard{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--panel);min-height:340px}
.wcard .face{padding:clamp(22px,4vw,40px);display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 16%,transparent),transparent 60%)}
.wcard .face::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--gc)}
.wcard .w{font:400 clamp(38px,6vw,64px)/1 var(--disp);letter-spacing:-.02em;overflow-wrap:anywhere}
.wcard .en{font-size:20px;color:var(--ink2)}
.wcard .side{padding:clamp(18px,3vw,30px);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px;justify-content:center;background:var(--panel2)}
.ex{display:flex;gap:10px;align-items:flex-start}
.ex .de{font-size:18px}
.ex .tr{font-size:14px;color:var(--ink3)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--line2)}
.dots i.on{background:var(--gold)}
table.gt{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
table.gt td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
table.gt td:first-child{color:var(--ink2);white-space:nowrap}
table.gt td:nth-child(2){font-weight:500}
table.gt b{color:var(--goldInk);font-weight:600}
table.gt td[data-say]{cursor:pointer;text-decoration:underline dotted var(--ink3);text-underline-offset:4px}
table.gt td[data-say]:hover,table.gt td.speaking{color:var(--goldInk)}
.gcard p b{color:var(--goldInk)}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:min(560px,86%);padding:12px 14px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:border-color .15s}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--gold) 14%,var(--panel));border-color:transparent}
.bub.live{border-color:var(--gold);box-shadow:0 0 0 4px var(--goldSoft)}
.bub .who{font-size:12px;color:var(--ink3)}
.bub .t{font-size:17px}
.bub .tr{font-size:14px;color:var(--ink3);margin-top:2px}
.hideTr .tr{display:none}

/* ---------- quiz ---------- */
.quiz{max-width:760px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.qtop .bar{flex:1;height:10px}
.combo{font:500 14px var(--disp);color:var(--goldInk);min-width:54px;text-align:right}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,34px);min-height:300px}
.qk{font-size:14px;color:var(--ink3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.qp{font:400 clamp(28px,4.5vw,44px)/1.1 var(--disp);margin-bottom:22px;overflow-wrap:anywhere}
.qp.md{font-size:clamp(22px,3.4vw,30px)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:58px;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);text-align:left;font-size:17px;display:flex;align-items:center;gap:12px;transition:transform .1s,border-color .15s}
.opt:hover{border-color:var(--ink3)}
.opt .n{font-size:12px;color:var(--ink3);border:1px solid var(--line2);border-radius:6px;padding:0 6px;flex:none}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel2))}
.opt.badc{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel2))}
.opt.dim{opacity:.5}
.gbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gbtn{min-height:72px;border-radius:16px;border:2px solid var(--gc);background:color-mix(in srgb,var(--gc) 10%,var(--panel));font:500 24px var(--disp);color:var(--ink)}
.gbtn:hover{background:color-mix(in srgb,var(--gc) 22%,var(--panel))}
.fb{margin-top:18px;padding:16px 18px;border-radius:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;animation:rise .25s ease both}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fb.mid{background:var(--goldSoft);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.fb .msg{flex:1;min-width:200px}
.fb .msg b{display:block;font:500 18px var(--disp)}
.uml{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.uml button{min-width:44px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-size:17px}
.tiles2{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border-radius:14px;border:1px dashed var(--line2);background:var(--panel2)}
.tiles2.pool{border-style:solid;background:transparent;border-color:transparent;padding:10px 0}
.tk{min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);font-size:17px;box-shadow:0 2px 0 var(--line2)}
.tk:active{transform:translateY(1px)}
.speakbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.bigmic{width:84px;height:84px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center}
.bigmic .ic{width:34px;height:34px}
.bigmic.listening{background:var(--red);color:#fff;border-color:transparent;animation:pulse 1.2s infinite}
.heard{font-size:15px;color:var(--ink2);text-align:center;min-height:22px}
.wscore{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wscore span{padding:4px 10px;border-radius:9px;font-size:18px}
.wscore .s3{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.wscore .s2{background:var(--goldSoft);color:var(--goldInk)}
.wscore .s1{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.result{text-align:center;padding:30px 10px}
.result .big{font:300 clamp(64px,10vw,104px)/1 var(--disp)}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.stars .ic{width:34px;height:34px;color:var(--line2)}
.stars .ic.on{color:var(--gold);fill:var(--gold)}

/* ---------- flashcards ---------- */
.fc{perspective:1200px;max-width:720px;margin:0 auto}
.fcin{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,40px);min-height:330px;display:flex;flex-direction:column;gap:12px;justify-content:center;text-align:center;align-items:center;position:relative;overflow:hidden}
.fcin::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--gc,var(--gold))}
.fcin .w{font:400 clamp(36px,6vw,58px)/1.05 var(--disp);overflow-wrap:anywhere}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.grades button{min-height:62px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500}
.grades button small{font-weight:400;font-size:12px;color:var(--ink3)}
.grades button:nth-child(1){border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.grades button:nth-child(4){border-color:color-mix(in srgb,var(--ok) 50%,transparent)}

/* ---------- games ---------- */
.arena{position:relative;height:min(62vh,520px);border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));overflow:hidden;touch-action:manipulation}
.arena .lane{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33.2%,var(--line) 33.3%,transparent 33.4%,transparent 66.5%,var(--line) 66.6%,transparent 66.7%)}
.fall{position:absolute;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:14px;background:var(--ink);color:var(--bg);font:500 26px var(--disp);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.floor{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red);opacity:.6}
.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font:500 16px var(--disp);z-index:2}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mc{aspect-ratio:4/3;border-radius:14px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;padding:8px;text-align:center;font-size:16px;position:relative;transition:transform .2s,background .2s}
.mc.back{background:repeating-linear-gradient(135deg,var(--panel2) 0 10px,var(--panel) 10px 20px);color:transparent}
.mc.back::after{content:"?";position:absolute;color:var(--ink3);font:500 24px var(--disp)}
.mc.done{opacity:.35;transform:scale(.96)}
.mc.de{font:500 18px var(--disp)}
.bignum{font:300 clamp(56px,9vw,96px)/1 var(--disp);text-align:center;font-variant-numeric:tabular-nums}

/* ---------- galaxy ---------- */
.gal{position:relative;height:min(70vh,620px);border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at center,#141a2a 0,#07090d 70%);border:1px solid var(--line)}
.gal canvas{position:absolute;inset:0;width:100%;height:100%}
.galtip{position:absolute;pointer-events:none;padding:8px 12px;border-radius:12px;background:rgba(10,12,16,.9);color:#eef0f2;border:1px solid rgba(255,255,255,.15);font-size:14px;transform:translate(-50%,-120%);white-space:nowrap;display:none}
.galtip b{font:500 17px var(--disp)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* ---------- lazy / shadow ---------- */
.player{border-radius:24px;padding:clamp(24px,5vw,56px);background:radial-gradient(120% 140% at 50% 0%,#1d2533 0,#0a0d12 65%);color:#f2f4f6;border:1px solid rgba(255,255,255,.08);text-align:center;position:relative;overflow:hidden;min-height:360px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.player::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,var(--gc,var(--gold)),transparent 30%);opacity:.18;animation:spin 14s linear infinite}
.player.paused::before{animation-play-state:paused}
@keyframes spin{to{transform:rotate(1turn)}}
.player>*{position:relative}
.player .w{font:400 clamp(38px,7vw,72px)/1.05 var(--disp);overflow-wrap:anywhere}
.player .en{font-size:22px;opacity:.75;min-height:34px;transition:opacity .3s}
.player .say{font:500 15px var(--body);opacity:.75;min-height:22px}
.player .g-m{color:#86b0ff}.player .g-f{color:#ff8591}.player .g-n{color:#5fe3ad}.player .g-p{color:#b79cff}
.player .ctl{display:flex;gap:10px;justify-content:center;margin-top:10px}
.player .ctl .ibtn{background:transparent;color:#f2f4f6;border-color:rgba(255,255,255,.25);width:56px;height:56px;border-radius:50%}
.player .ctl .ibtn.main{background:var(--gold);color:#1a1400;border-color:transparent;width:68px;height:68px}
.kara{font:400 clamp(28px,4.6vw,46px)/1.25 var(--disp);display:flex;flex-wrap:wrap;gap:.25em .35em;justify-content:center}
.kara span{opacity:.35;transition:opacity .12s,color .12s}
.kara span.on{opacity:1;color:var(--gold)}
.kara span.past{opacity:.9}
.slist{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;padding-right:4px}
.slist button{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.slist button.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldSoft)}

/* ---------- sounds, bridge, radar ---------- */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.abc button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s}
.abc button:hover{transform:translateY(-2px);border-color:var(--line2)}
.abc button b{font:400 34px/1 var(--disp)}
.abc button small{font-size:12px;color:var(--ink3)}
.abc button.sp{border-color:var(--gold);box-shadow:0 0 0 4px var(--goldSoft)}
.abc button.uml b{color:var(--goldInk)}
.snd{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.snd .card{display:flex;flex-direction:column;gap:8px;padding:16px}
.snd .k{font:500 22px var(--disp);color:var(--goldInk)}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-size:16px}
.wchip:hover{border-color:var(--gold)}
.rule{display:flex;flex-direction:column;gap:8px}
.shift{font:500 22px var(--disp);display:flex;align-items:center;gap:10px}
.shift .ic{color:var(--goldInk)}
.radarbig{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.radarorb{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle,color-mix(in srgb,var(--gc) 35%,transparent),transparent 70%);border:2px solid var(--gc);font:500 34px var(--disp)}
.radarorb::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 0deg,var(--gc),transparent 25%);opacity:.35;animation:spin 3s linear infinite;mask:radial-gradient(circle,transparent 60%,#000 61%)}
.meter{height:12px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--gc);transition:width .4s}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:16px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.kpi b{display:block;font:400 34px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink3)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--gold) 30%,var(--panel2))}.heat i.l2{background:color-mix(in srgb,var(--gold) 55%,var(--panel2))}.heat i.l3{background:color-mix(in srgb,var(--gold) 80%,var(--panel2))}.heat i.l4{background:var(--gold)}
.hrow{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.hrow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.vbars{display:flex;align-items:flex-end;gap:8px;height:120px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--ink3)}
.vbars i{width:100%;max-width:36px;border-radius:6px 6px 2px 2px;background:var(--gold);min-height:2px}
.membar{display:flex;height:14px;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.membar i{display:block;height:100%}

/* ---------- misc overlays ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:100;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;transition:.3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.xpfloat{position:fixed;z-index:101;pointer-events:none;font:600 18px var(--disp);color:var(--goldInk);animation:xpf 1.1s ease-out forwards}
@keyframes xpf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;animation:rise .2s}
.modal .card{max-width:440px;width:100%}
.note{padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px;color:var(--ink2)}
.note.gold{background:var(--goldSoft);border-color:transparent;color:var(--ink)}
.src a{color:var(--goldInk)}
details summary{cursor:pointer;color:var(--ink2)}
textarea.input{min-height:120px;font:13px/1.4 ui-monospace,monospace}

/* ---------- responsive ---------- */
@media (max-width:1080px){.cta{grid-template-columns:1fr 1fr}.cta a.go{grid-column:1/-1}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .rail{display:none}
 .mobnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ld21);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .mobnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);text-decoration:none;padding:6px 0;min-height:48px}
 .mobnav a.on{color:var(--goldInk)}
 .hero{grid-template-columns:1fr}
 .wcard{grid-template-columns:1fr}.wcard .side{border-left:0;border-top:1px solid var(--line)}
 .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
 .g2,.g3,.g4{grid-template-columns:1fr}
 .cta{grid-template-columns:1fr}
 .opts{grid-template-columns:1fr}
 .today{grid-template-columns:1fr;justify-items:start}
 .grades{grid-template-columns:repeat(2,minmax(0,1fr))}
 .mem{grid-template-columns:repeat(3,minmax(0,1fr))}
 .radarbig{grid-template-columns:1fr;justify-items:center;text-align:center}
 .wotd{grid-template-columns:1fr auto}.wotd .wgo{grid-column:1/-1}
 .top .chip.hidem{display:none}
 .hrow{grid-template-columns:86px minmax(0,1fr) 44px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#home"><span class="logo">S</span><span><b>Sprachwerk</b><span class="sub">German, engineered for you</span></span></a>
    <div class="grp">Learn</div>
    <a class="nav" data-nav="home" href="#home"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Start</a>
    <a class="nav" data-nav="path" href="#path"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h8a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h8"/></svg>Linie A1</a>
    <a class="nav" data-nav="review" href="#review"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>Review</a>
    <a class="nav" data-nav="practice" href="#practice"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>Practice</a>
    <div class="sep"></div><div class="grp">Labs</div>
    <a class="nav" data-nav="missions" href="#missions"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Berlin Missions</a>
    <a class="nav" data-nav="shadow" href="#shadow"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Shadow Studio</a>
    <a class="nav" data-nav="lazy" href="#lazy"><svg class="ic" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></svg>Lazy Mode</a>
    <a class="nav" data-nav="galaxy" href="#galaxy"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/><circle cx="12" cy="12" r="2"/></svg>Memory Galaxy</a>
    <a class="nav" data-nav="bridge" href="#bridge"><svg class="ic" viewBox="0 0 24 24"><path d="M2 18h20M2 14c4-6 16-6 20 0M5 18v-5.5M19 18v-5.5M9 18v-7.6M15 18v-7.6M12 18v-8"/></svg>English Bridge</a>
    <a class="nav" data-nav="radar" href="#radar"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg>Genus Radar</a>
    <a class="nav" data-nav="sounds" href="#sounds"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12h1M7 8v8M11 5v14M15 9v6M19 7v10"/></svg>Sound Lab</a>
    <a class="nav" data-nav="games" href="#games"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/></svg>Games</a>
    <div class="sep"></div>
    <a class="nav" data-nav="stats" href="#stats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
    <a class="nav" data-nav="method" href="#method"><svg class="ic" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3M7.5 15h9"/></svg>The method</a>
    <a class="nav" data-nav="setup" href="#setup"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</a>
    <div class="foot"><span class="dot syncdot"></span><span class="synctxt">Saved on this device</span></div>
  </nav>
  <div class="main">
    <header class="top">
      <span class="crumb" id="crumb">Sprachwerk</span>
      <span class="chip flame" title="Day streak"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-1 1-5 1-9z"/></svg><b id="tStreak">0</b></span>
      <span class="chip bolt" title="XP today / daily goal"><svg class="ic" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><b id="tToday">0/50</b></span>
      <span class="chip hidem" title="Total XP"><b id="tXP">0</b>&nbsp;XP</span>
      <a class="chip hidem" href="#stats" id="tLevel" style="text-decoration:none">Lv 1</a>
    </header>
    <main id="view" class="view"><noscript>Sprachwerk needs JavaScript to run.</noscript></main>
  </div>
</div>
<nav class="mobnav" aria-label="Main">

 {t:'The accusative: only masculine changes', p:'The thing you want, eat, have or buy is the <b>object</b> (accusative). Good news: only masculine words change — <b>ein → einen</b>, <b>der → den</b>. Feminine, neuter and plural stay the same.',
  table:[['masculine','ein Kaffee → ich möchte <b>einen</b> Kaffee','der → <b>den</b>'],['feminine','eine Suppe → ich möchte eine Suppe','die → die'],['neuter','ein Wasser → ich möchte ein Wasser','das → das'],['plural','Äpfel → ich möchte Äpfel','die → die']]},
 {t:'kein — "no / not a"', p:'Negate a noun with <b>kein</b>. It takes the same endings as ein: kein, keine, kein — and <b>keinen</b> for masculine objects. Also note: essen changes e → i: du <b>isst</b>, er <b>isst</b>.',
  ex:[['Ich esse kein Fleisch.','I don\'t eat meat.'],['Ich trinke keinen Kaffee.','I don\'t drink coffee.'],['Er isst keine Suppe.','He isn\'t eating soup.']]}
],

/* ---------- numbers & clock in German ---------- */
const ONES = ['null', 'eins', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun', 'zehn', 'elf', 'zwölf', 'dreizehn', 'vierzehn', 'fünfzehn', 'sechzehn', 'siebzehn', 'achtzehn', 'neunzehn'];
const TENS = { 2: 'zwanzig', 3: 'dreißig', 4: 'vierzig', 5: 'fünfzig', 6: 'sechzig', 7: 'siebzig', 8: 'achtzig', 9: 'neunzig' };
function numDe(n) {
  if (n < 20) return ONES[n];
  if (n < 100) { const t = Math.floor(n / 10), o = n % 10; return o ? (o === 1 ? 'ein' : ONES[o]) + 'und' + TENS[t] : TENS[t]; }
  if (n < 1000) { const h = Math.floor(n / 100), r = n % 100; return (h === 1 ? '' : (h === 1 ? 'ein' : ONES[h])) + 'hundert' + (r ? numDe(r) : ''); }
  return String(n);
}
function clockDe(d = new Date()) {
  const h = d.getHours(), m = d.getMinutes();
  const hw = x => { const v = x % 12 || 12; return v === 1 ? 'eins' : numDe(v); };
  const nx = h + 1;
  let s;
  if (m === 0) s = `Es ist ${hw(h) === 'eins' ? 'ein' : hw(h)} Uhr.`;
  else if (m === 15) s = `Es ist Viertel nach ${hw(h)}.`;
  else if (m === 30) s = `Es ist halb ${hw(nx)}.`;
  else if (m === 45) s = `Es ist Viertel vor ${hw(nx)}.`;
  else if (m < 20) s = `Es ist ${numDe(m)} nach ${hw(h)}.`;
  else if (m < 30) s = `Es ist ${numDe(30 - m)} vor halb ${hw(nx)}.`;
  else if (m < 40) s = `Es ist ${numDe(m - 30)} nach halb ${hw(nx)}.`;
  else s = `Es ist ${numDe(60 - m)} vor ${hw(nx)}.`;
  const formal = `${numDe(h) === 'eins' ? 'ein' : numDe(h)} Uhr${m ? ' ' + numDe(m) : ''}`;
  return { s, formal };
}

}

}

const Rcall = (c, now = Date.now()) => c ? Math.pow(0.9, ((now - c.l) / DAY) / c.s) : 0;

}

  const s = nextStab(c, g, now);
  S.cards[id] = { s, r: (c ? c.r : 0) + 1, x: (c ? c.x : 0) + (g === 0 ? 1 : 0), l: now, d: now + s * DAY };

const Voice = {
  voices: [], de: null, en: null, de2: null, hq: false, tts: null, cur: 0,
  init() {
    if ('speechSynthesis' in window) {

      load(); try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
    }
    claudeUse('tts').then(t => { this.tts = t; if (t && t.onState) { try { t.onState(({ state }) => { if (state !== 'speaking') this._ttsIdle && this._ttsIdle(); }); } catch (e) { } } if (location.hash === '#setup') route(); });

  score(v) { return (/natural|neural|online/i.test(v.name) ? 50 : 0) + (/google/i.test(v.name) ? 40 : 0) + (/premium|enhanced|siri/i.test(v.name) ? 35 : 0) + (/katja|conrad|amala|seraphina|florian|killian|anna|petra|helena|markus|yannick|marlene|hans|vicki/i.test(v.name) ? 8 : 0) + (v.lang === 'de-DE' ? 5 : 0); },
  pick() {

    if (e === 'browser' && hasBrowser) return 'browser';

  label() { const e = this.engine(); return e === 'claude' ? 'Claude voice' : e === 'browser' ? (this.de ? this.de.name : 'Browser default voice') : 'No voice available'; },
  stop() { this.cur++; try { speechSynthesis.cancel(); } catch (e) { } try { this.tts && this.tts.stop(); } catch (e) { } },

const normA = s => String(s).toLowerCase().replace(/ß/g, 'ss').replace(/[.,!?;:"„“”‚‘'’()\[\]–—…-]/g, ' ').replace(/\s+/g, ' ').trim();

  for (let i = 1; i <= a.length; i++) { const cur = [i]; for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }

}

    const words = tw.map(w => { const n = normA(w); let m = 0; hw.forEach(x => { m = Math.max(m, sim(n, x)); }); return { w, s: m }; });
    const avg = words.reduce((a, x) => a + x.s, 0) / (words.length || 1);
    const whole = sim(target, h);
    const score = Math.round(100 * clamp(0.6 * avg + 0.4 * whole, 0, 1));

}

function checkTyped(input, target, word) {

  const uml = s => s.replace(/ae/g, 'ä').replace(/oe/g, 'ö').replace(/ue/g, 'ü').replace(/Ae/g, 'Ä').replace(/Oe/g, 'Ö').replace(/Ue/g, 'Ü');

  if (word && word.g) {

    if (parts.length === 1 && sim(parts[0], word.de) > 0.85) return { r: 'almost', m: `Include the article: ${full(word)}` };
    if (parts.length === 2 && ['der', 'die', 'das'].includes(parts[0].toLowerCase()) && sim(parts[1], word.de) > 0.85 && parts[0].toLowerCase() !== ART[word.g]) return { r: 'no', m: `Right word, wrong article — it's ${full(word)}.`, gender: true };

    if (q.skill) skillHit(q.skill, ok);

    xpGain += gain;

function poolWords(scope) {

function buildPractice(mode, scope, n = 12) {
  const ws = shuffle(poolWords(scope)), us = poolUnits(scope);
  if (mode === 'gender') return shuffle(ws.filter(w => w.g && w.g !== 'p')).slice(0, n).map(Q.gender);
  if (mode === 'plural') return shuffle(ws.filter(w => w.pl && w.pl !== w.de)).slice(0, n).map(Q.plural);
  if (mode === 'gap') return shuffle(us.flatMap(u => u.gaps)).slice(0, n).map(Q.gap);
  if (mode === 'build') return shuffle(us.flatMap(u => u.build)).slice(0, 8).map(Q.build);
  if (mode === 'speak') return shuffle([...us.flatMap(u => u.phrases.map(p => [p[0], p[1]])), ...ws.slice(0, 6).map(w => [full(w), w.en, w])]).slice(0, 8).map(x => Q.speak(x[0], x[1], x[2]));
  if (mode === 'mix') { const kinds = ['deEn', 'enDe', 'listen', 'type', 'dictate']; const qs = ws.slice(0, 8).map((w, i) => Q[kinds[i % 5]](w)); shuffle(ws.filter(w => w.g && w.g !== 'p')).slice(0, 2).forEach(w => qs.push(Q.gender(w))); shuffle(us.flatMap(u => u.gaps)).slice(0, 2).forEach(g => qs.push(Q.gap(g))); return shuffle(qs); }
  return ws.slice(0, n).map(w => Q[mode](w));
}

/* ================= GENUS RADAR (gender prediction) ================= */
const RADAR_EXTRA = [['Zeitung', 'f', 'newspaper'], ['Freiheit', 'f', 'freedom'], ['Möglichkeit', 'f', 'possibility'], ['Freundschaft', 'f', 'friendship'], ['Situation', 'f', 'situation'], ['Universität', 'f', 'university'], ['Politik', 'f', 'politics'], ['Bäckerei', 'f', 'bakery'], ['Kultur', 'f', 'culture'], ['Lehrerin', 'f', 'female teacher'], ['Katze', 'f', 'cat'], ['Gesundheit', 'f', 'health'], ['Mannschaft', 'f', 'team'],
['Mädchen', 'n', 'girl'], ['Fräulein', 'n', 'young lady (old-fashioned)'], ['Dokument', 'n', 'document'], ['Zentrum', 'n', 'centre'], ['Thema', 'n', 'topic'], ['Ergebnis', 'n', 'result'], ['Gemüse', 'n', 'vegetables'], ['Gebäude', 'n', 'building'], ['Geschenk', 'n', 'gift'], ['Instrument', 'n', 'instrument'], ['Datum', 'n', 'date'],
['Frühling', 'm', 'spring'], ['Schmetterling', 'm', 'butterfly'], ['Optimismus', 'm', 'optimism'], ['Motor', 'm', 'engine'], ['König', 'm', 'king'], ['Honig', 'm', 'honey'], ['Teppich', 'm', 'carpet'], ['Elefant', 'm', 'elephant'], ['Lehrer', 'm', 'teacher'], ['Löffel', 'm', 'spoon'], ['Garten', 'm', 'garden'], ['Hund', 'm', 'dog'],
['Messer', 'n', 'knife'], ['Butter', 'f', 'butter'], ['Sprung', 'm', 'jump'], ['Name', 'm', 'name'], ['Auge', 'n', 'eye'], ['Käse', 'm', 'cheese']];
function genderGuess(raw, ruleOnly) {
  const w = String(raw || '').trim().replace(/^(der|die|das)\s+/i, ''); if (!w || /\s/.test(w)) return null;
  const lw = w.toLowerCase();
  if (!ruleOnly) {
    const hit = WORDS.find(x => x.g && x.g !== 'p' && x.de.toLowerCase() === lw) || RADAR_EXTRA.map(x => ({ de: x[0], g: x[1], en: x[2] })).find(x => x.de.toLowerCase() === lw);
    if (hit) { const r = genderGuess(w, true); return { g: hit.g, conf: 100, src: 'dict', note: `Known word: ${ART[hit.g]} ${hit.de} (${hit.en}).` + (r && r.g !== hit.g && r.conf >= 60 ? ` The ending alone would suggest ${ART[r.g]} — this one is an exception.` : r && r.conf >= 60 ? ` The ending agrees: ${r.note}` : ''), en: hit.en, rule: r }; }
  }
  const rules = [...GENDER_RULES].sort((a, b) => b[0].length - a[0].length);
  const match = rules.find(([end]) => lw.endsWith(end) && lw.length > end.length + 1);
  if (match && match[2] >= 95) return { g: match[1], conf: match[2], note: match[3], end: match[0], src: 'rule' };
  if (/^ge/.test(lw) && lw.length > 5) return { g: 'n', conf: 90, note: 'About 90% of nouns starting with Ge- are neuter (das Gebäude, das Geschenk).', end: 'Ge-', src: 'rule' };
  if (match) return { g: match[1], conf: match[2], note: match[3], end: match[0], src: 'rule' };
  if ((lw.match(/[aeiouäöüy]+/g) || []).length === 1) return { g: 'm', conf: 67, note: 'One-syllable nouns are masculine about two-thirds of the time.', end: '1 syllable', src: 'rule' };
  return { g: 'f', conf: 46, note: 'No ending clue. If you must guess, guess die — about 46% of nouns are feminine.', end: '—', src: 'rule' };
}

  <div class="card" style="margin-top:20px"><input id="rin" class="input" placeholder="Type a noun… e.g. Zeitung, Mädchen, Frühling" autocomplete="off" spellcheck="false" style="font-size:22px;min-height:58px"><div class="wchips" style="margin-top:10px">${['Zeitung', 'Mädchen', 'Frühling', 'Gemüse', 'Universität', 'Messer', 'Optimismus', 'Lampe'].map(x => `<button class="wchip" data-try="${x}">${x}</button>`).join('')}</div>

  };
  inp.oninput = show; show();
  $$('[data-try]', v).forEach(b => b.onclick = () => { inp.value = b.dataset.try; show(); });
  radarDrill($('#rdrill', v));

function radarDrill(box) {

    const [de, g, en] = items[i];

    $$('.gbtn', box).forEach(b => b.onclick = () => {

      const r = genderGuess(de, true); const exc = r.g !== g;
      $('[data-f]', box).innerHTML = `<div class="fb ${good ? 'ok' : 'no'}"><div class="msg"><b>${ART[g]} ${esc(de)}</b><span class="muted">${exc ? `Exception! The radar would say ${ART[r.g]} (${esc(r.note)})` : esc(r.note)}</span></div>${sayBtn(ART[g] + ' ' + de, 'sm')}<button class="btn pri" data-n>Next</button></div>`;
      Voice.speak(ART[g] + ' ' + de);
      $('[data-n]', box).onclick = () => { i++; draw(); };
    });
  };
  draw();
}

VIEWS.bridge = v => {
  v.innerHTML = `<h1>English Bridge</h1><p class="muted" style="margin-top:8px;max-width:66ch">English and German split from the same ancestor about 1,500 years ago. Then German consonants shifted — English didn't. Learn these ten shifts and thousands of German words become readable through your English.</p>
  <section class="sec"><div class="row between"><h2>Decoder challenge</h2><span class="tag gold">Best: ${S.games.bridge || 0}/12</span></div><div id="bgame"></div></section>
  <section class="sec"><h2>The ten shifts</h2><div class="snd">${BRIDGE_RULES.map(r => `<div class="card rule"><div class="shift">${esc(r.en)} ${icon('right')} ${esc(r.de)}</div><div class="muted small">${esc(r.note)}</div><div class="wchips">${BRIDGE.filter(b => b[2] === r.id).slice(0, 5).map(b => `<button class="wchip" data-say="${esc(b[1])}"><span class="faint">${esc(b[0].replace('to ', ''))}</span> → ${esc(b[1])}</button>`).join('')}</div></div>`).join('')}</div></section>`;
  bridgeGame($('#bgame', v));
};
function bridgeGame(box) {
  const items = shuffle(BRIDGE).slice(0, 12); let i = 0, ok = 0;
  const draw = () => {
    if (i >= items.length) {
      S.games.bridge = Math.max(S.games.bridge || 0, ok); save(); addXP(ok * 2);
      box.innerHTML = `<div class="card row between"><div><b style="font:500 24px var(--disp)">${ok}/12 decoded</b><div class="muted small">${ok >= 10 ? 'You can read German through English now.' : 'Look at the rule cards below, then try again.'}</div></div><button class="btn pri" data-a>Play again</button></div>`;
      $('[data-a]', box).onclick = () => bridgeGame(box); return;

  let boundary = false; const total = Math.max(900, text.length * 78 / rate); const wts = words.map(w => w.length + 2); const sum = wts.reduce((a, b) => a + b, 0);
  let acc = 0; const timers = words.map((w, k) => { const t = setTimeout(() => { if (!boundary) setOn(k); }, 120 + acc / sum * total); acc += wts[k]; return t; });

  <div class="grid g4" id="sbtn"><button class="btn" data-a="slow">1 · Listen slow</button><button class="btn" data-a="norm">2 · Listen</button><button class="btn" data-a="shadow">3 · Shadow ×3</button><button class="btn pri" data-a="solo" data-needs-mic>4 · Say it alone</button></div><div id="sres"></div></div></div>`;
  if (window.innerWidth < 900) $('#sg', v).style.gridTemplateColumns = '1fr';
  const sl = $('#sl', v), sk = $('#sk', v), sen = $('#sen', v), stp = $('#sstep', v), res = $('#sres', v);
  $('#ssrc', v).value = src; $('#ssrc', v).onchange = e => { shadowSrc = e.target.value; route(); };
  const drawList = () => { sl.innerHTML = lines.map((l, k) => { const b = S.shadow[hash(l[0])]; return `<button class="${k === sel ? 'on' : ''}" data-k="${k}"><span>${esc(l[0])}</span>${b ? `<span class="tag ${b >= 80 ? 'gold' : ''}">${b}%</span>` : ''}</button>`; }).join(''); $$('button', sl).forEach(b => b.onclick = () => { if (busy) Voice.stop(); sel = +b.dataset.k; drawList(); drawSel(); }); };
  const drawSel = () => { const [de, en] = lines[sel]; sk.innerHTML = de.split(' ').map(w => `<span>${esc(w)}</span>`).join(''); sen.textContent = en; stp.textContent = 'Sentence ' + (sel + 1) + ' of ' + lines.length; res.innerHTML = ''; };
  drawList(); drawSel();
  const act = async a => {
    const [de] = lines[sel];
    if (a === 'solo') {
      const mic = $('[data-a="solo"]', v); mic.classList.add('listening'); stp.textContent = 'Your turn — speak now'; sk.innerHTML = de.split(' ').map(w => `<span>${esc(w)}</span>`).join('');
      Ear.listen({ partial: t => { sen.textContent = '“' + t + '”'; }, done: ({ text, alts, error }) => {
        mic.classList.remove('listening'); sen.textContent = lines[sel][1];
        if (error || !text) { stp.textContent = error || 'Didn\'t catch that — try again.'; return; }
        const r = scoreSpeech(de, text, alts); const k = hash(de); S.shadow[k] = Math.max(S.shadow[k] || 0, r.score); skillHit('speak', r.score >= 70); save();
        sk.innerHTML = r.words.map(x => `<span class="past" style="color:${x.s >= .8 ? 'var(--green)' : x.s >= .55 ? 'var(--gold)' : 'var(--red)'}">${esc(x.w)}</span>`).join('');
        stp.textContent = `Score ${r.score}%`; res.innerHTML = `<div class="note">Heard: “${esc(r.heard)}”. ${r.score >= 85 ? 'Excellent — move to the next sentence.' : r.score >= 65 ? 'Close. Shadow it once more, then retry.' : 'Listen slowly (step 1), shadow (step 3), then try again.'}</div>`;
        if (r.score >= 70) addXP(r.score >= 85 ? 8 : 5, mic); drawList();
      } });
      return;
    }
    if (busy) { Voice.stop(); busy = false; return; }
    busy = true;
    if (a === 'slow') { stp.textContent = 'Listen closely — slow'; await karaoke(sk, de, 0.7); }
    if (a === 'norm') { stp.textContent = 'Listen — natural speed'; await karaoke(sk, de, 1); }
    if (a === 'shadow') { for (let k = 0; k < 3 && alive && busy; k++) { stp.textContent = `Speak WITH the voice · round ${k + 1}/3`; await karaoke(sk, de, [0.8, 0.9, 1][k]); await sleep(700); } if (alive) addXP(2); }
    busy = false; if (alive) stp.textContent = 'Sentence ' + (sel + 1) + ' of ' + lines.length;
  };
  $$('#sbtn [data-a]', v).forEach(b => b.onclick = () => act(b.dataset.a));
};

/* ================= LAZY MODE ================= */
VIEWS.lazy = v => {
  let src = 'smart', gap = 3, showEx = true;
  v.innerHTML = `<h1>Lazy Mode</h1><p class="muted" style="margin-top:8px;max-width:64ch">A hands-free audio loop for commutes, cooking or the gym. German → pause (say it!) → English → German again. Just press play and listen — the screen stays awake while it plays.</p>
  <div class="card row" style="margin-top:16px"><select id="lsrc" class="input" style="max-width:300px"><option value="smart">Smart mix (due, weak, new)</option><option value="learned">Everything I've learned</option>${UNITS.map(u => `<option value="u${u.id}">Station ${u.id} · ${esc(u.de)}</option>`).join('')}</select><select id="lgap" class="input" style="max-width:170px"><option value="2">2 s pause</option><option value="3" selected>3 s pause</option><option value="5">5 s pause</option></select><label class="row small"><input type="checkbox" id="lex" checked> Example sentences</label></div>
  <div class="player paused gbar-x" id="lp" style="margin-top:16px"><div class="say" id="lstep">Press play</div><div class="w" id="lw">Bereit?</div><div class="en" id="len">Ready?</div><div class="say" id="lex2"></div><div class="ctl"><button class="ibtn" data-p aria-label="Previous">${icon('prev')}</button><button class="ibtn main" data-pp aria-label="Play or pause">${icon('play', 'lg')}</button><button class="ibtn" data-n aria-label="Next">${icon('next')}</button></div><div class="say" id="lcount"></div></div>`;
  let list = [], i = 0, playing = false, token = 0;
  const build = () => {
    if (src === 'smart') { const d = dueIds().slice(0, 10), weak = learnedIds().filter(id => !d.includes(id)).sort((a, b) => Rcall(S.cards[a]) - Rcall(S.cards[b])).slice(0, 6); const cu = unitById(Math.max(1, Math.min(12, currentStation()))); const fresh = cu.words.filter(w => !S.cards[w.id]).slice(0, 8).map(w => w.id); list = shuffle([...d, ...weak, ...fresh]).map(id => WMAP[id]); if (list.length < 6) list = shuffle(cu.words); }
    else if (src === 'learned') { list = shuffle(learnedIds().map(id => WMAP[id])); if (!list.length) list = shuffle(UNITS[0].words); }
    else list = unitById(src.slice(1)).words.slice();
    i = 0;
  };
  build();
  const P = $('#lp', v), W = $('#lw', v), E = $('#len', v), St = $('#lstep', v), X = $('#lex2', v), C = $('#lcount', v);
  const setPP = () => { $('[data-pp]', v).innerHTML = icon(playing ? 'pause' : 'play', 'lg'); P.classList.toggle('paused', !playing); };
  const playItem = async () => {
    const my = ++token; const w = list[i % list.length]; const ok = () => playing && my === token;
    P.className = P.className.replace(/gbar-\w+/, 'gbar-' + (w.g || 'x'));
    W.innerHTML = wordHTML(w); E.style.opacity = 0; E.textContent = w.en; X.textContent = ''; C.textContent = `${(i % list.length) + 1} / ${list.length}`;
    St.textContent = 'Listen'; await Voice.speak(full(w), { rate: .85 }); if (!ok()) return;
    for (let s = gap; s > 0; s--) { St.textContent = `Say it out loud · ${s}`; await sleep(1000); if (!ok()) return; }
    E.style.opacity = 1; St.textContent = 'Meaning'; await Voice.speak(w.en, { lang: 'en' }); if (!ok()) return;
    await sleep(250); St.textContent = 'Once more'; await Voice.speak(full(w)); if (!ok()) return;
    if (showEx && w.ex) { X.textContent = w.ex + ' — ' + w.exEn; await sleep(300); await Voice.speak(w.ex, { rate: .9 }); if (!ok()) return; }
    addXP(1); await sleep(700); if (!ok()) return;
    i++; playItem();
  };
  let lock = null;
  const wake = async on => { try { if (on && 'wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } else if (!on && lock) { await lock.release(); lock = null; } } catch (e) { lock = null; } };
  const vis = () => { if (document.visibilityState === 'visible' && playing) wake(true); };
  document.addEventListener('visibilitychange', vis);
  onLeave(() => { playing = false; token++; wake(false); document.removeEventListener('visibilitychange', vis); });
  $('[data-pp]', v).onclick = () => { playing = !playing; setPP(); wake(playing); if (playing) playItem(); else { token++; Voice.stop(); St.textContent = 'Paused'; } };
  $('[data-n]', v).onclick = () => { i++; token++; Voice.stop(); if (playing) playItem(); else { const w = list[i % list.length]; W.innerHTML = wordHTML(w); E.textContent = w.en; E.style.opacity = 1; } };
  $('[data-p]', v).onclick = () => { i = Math.max(0, i - 1); token++; Voice.stop(); if (playing) playItem(); };
  $('#lsrc', v).onchange = e => { src = e.target.value; build(); token++; Voice.stop(); if (playing) playItem(); };
  $('#lgap', v).onchange = e => { gap = +e.target.value; };
  $('#lex', v).onchange = e => { showEx = e.target.checked; };
};

/* ================= MEMORY GALAXY ================= */
VIEWS.galaxy = v => {
  const ids = learnedIds(); const now = Date.now();
  const fading = ids.filter(id => Rcall(S.cards[id], now) < .8);
  const avg = ids.length ? Math.round(ids.reduce((a, id) => a + Rcall(S.cards[id], now), 0) / ids.length * 100) : 0;
  v.innerHTML = `<div class="row between" style="align-items:flex-end"><div><h1>Memory Galaxy</h1><p class="muted" style="margin-top:8px;max-width:64ch">Every word in the course is a point of light. Words you've learned become stars; their brightness is your predicted recall <i>right now</i>, following the forgetting curve. Fading stars pulse red — rescue them before they go dark.</p></div></div>
  <div class="row" style="margin:16px 0;gap:10px"><span class="chip">${icon('star', 'sm')} ${ids.length} stars of ${WORDS.length}</span><span class="chip">${icon('galaxy', 'sm')} average recall ${avg}%</span><span class="chip" style="color:var(--redInk)">${fading.length} fading</span><button class="btn sm pri" data-rescue ${fading.length ? '' : 'disabled'}>Rescue fading stars</button></div>
  <div class="gal" id="gal"><canvas></canvas><div class="galtip" id="gt"></div>${ids.length ? '' : '<div style="position:absolute;inset:0;display:grid;place-items:center;color:#cfd6df;text-align:center;padding:20px"><div><div style="font:400 28px var(--disp)">The sky is still dark.</div><p style="opacity:.7;margin-top:8px">Learn your first words and watch them light up.</p><a class="btn pri" href="#unit-1" style="margin-top:14px">Start Station 1</a></div></div>'}</div>
  <div class="row between" style="margin-top:12px"><div class="legend"><span><i style="background:var(--blue)"></i>der</span><span><i style="background:var(--red)"></i>die</span><span><i style="background:var(--green)"></i>das</span><span><i style="background:var(--gold)"></i>other words</span><span>inner rings = early stations</span></div></div>
  <div id="gsel" style="margin-top:14px"></div>`;
  $('[data-rescue]', v).onclick = () => runFlash(v, fading.slice(0, 30));
  const box = $('#gal', v), cv = $('canvas', box), ctx = cv.getContext('2d'), tip = $('#gt', v);
  const col = { m: '#4f8dff', f: '#ff5d6c', n: '#2fd18f', p: '#b79cff', x: '#e8c547' };
  const stars = WORDS.map(w => ({ w, a0: (hash(w.id) % 1000) / 1000 * Math.PI * 2, j: ((hash(w.id + 'j') % 100) / 100 - .5), c: S.cards[w.id] }));
  let W = 0, H = 0, raf, hover = null, sel = null; const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const size = () => { const r = box.getBoundingClientRect(), d = devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  const ro = new ResizeObserver(size); ro.observe(box); size();
  const frame = t => {
    ctx.clearRect(0, 0, W, H); const cx = W / 2, cy = H / 2, Rx = W / 2 - 28, Ry = H / 2 - 28, k0 = .2, R = Math.min(W, H) / 2; const tt = reduce ? 0 : t / 1000;
    const ring = u => k0 + (u - 1) * (1 - k0) / 11;
    for (let u = 1; u <= 12; u++) { ctx.beginPath(); ctx.ellipse(cx, cy, Rx * ring(u), Ry * ring(u), 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.stroke(); }
    const cr = Math.min(Rx, Ry) * .13; const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr * 1.6); g.addColorStop(0, 'rgba(232,197,71,.95)'); g.addColorStop(.35, 'rgba(232,197,71,.35)'); g.addColorStop(1, 'rgba(232,197,71,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, cr * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1400'; ctx.font = '500 13px Jost, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(S.name, cx, cy + 4);
    const now = Date.now();
    stars.forEach(s => {
      const u = s.w.unit, rk = ring(u) + s.j * .035, ang = s.a0 + tt * (0.05 / (1 + u * .12));
      s.x = cx + Math.cos(ang) * Rx * rk; s.y = cy + Math.sin(ang) * Ry * rk;
      const c = S.cards[s.w.id];
      if (!c) { ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(s.x - .8, s.y - .8, 1.6, 1.6); s.r = 0; return; }
      const rc = Rcall(c, now), sz = 2.2 + 2.8 * Math.min(1, c.s / 30) + (hover === s || sel === s ? 2 : 0), color = col[s.w.g || 'x'];
      s.r = sz + 6; s.rc = rc;
      const gl = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, sz * 4); gl.addColorStop(0, color); gl.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = .12 + .6 * rc; ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(s.x, s.y, sz * 4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = .25 + .75 * rc; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, sz * .7, 0, Math.PI * 2); ctx.fill();
      if (rc < .8) { const ph = reduce ? .5 : (Math.sin(t / 300 + s.a0 * 5) + 1) / 2; ctx.globalAlpha = .3 + .5 * ph; ctx.strokeStyle = '#ff5d6c'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(s.x, s.y, sz + 4 + ph * 3, 0, Math.PI * 2); ctx.stroke(); }
      ctx.globalAlpha = 1;
    });
    if (hover) { tip.style.display = 'block'; tip.style.left = hover.x + 'px'; tip.style.top = hover.y + 'px'; tip.innerHTML = `<b>${esc(full(hover.w))}</b> · ${esc(hover.w.en)}<br><span style="opacity:.7">recall ${Math.round(hover.rc * 100)}%</span>`; } else tip.style.display = 'none';
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
  onLeave(() => { cancelAnimationFrame(raf); ro.disconnect(); });
  const find = e => { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; let best = null, bd = 1e9; stars.forEach(s => { if (!s.r) return; const d = (s.x - x) ** 2 + (s.y - y) ** 2; if (d < bd && d < Math.max(14, s.r) ** 2) { bd = d; best = s; } }); return best; };
  cv.onmousemove = e => { hover = find(e); cv.style.cursor = hover ? 'pointer' : 'default'; };
  cv.onmouseleave = () => hover = null;
  cv.onclick = e => {
    const s = find(e); if (!s) return; sel = s; Voice.speak(full(s.w)); const c = S.cards[s.w.id];
    const g = $('#gsel', v);
    g.innerHTML = `<div class="card gbar-${s.w.g || 'x'}" style="border-left:5px solid var(--gc)"><div class="row between"><div class="row">${sayBtn(full(s.w))}<div><div style="font:400 30px var(--disp)">${wordHTML(s.w)}</div><div class="muted">${esc(s.w.en)} · Station ${s.w.unit}</div></div></div><div class="row"><span class="tag">recall ${Math.round(Rcall(c) * 100)}%</span><span class="tag">stable for ~${fmtIv(c.s)}</span><span class="tag">${c.r} reviews</span></div></div><div class="row" style="margin-top:12px"><span class="muted small">Do you remember it right now?</span><button class="btn sm" data-gg="0">Forgot</button><button class="btn sm" data-gg="2">Remembered</button></div></div>`;
    $$('[data-gg]', g).forEach(b => b.onclick = () => { grade(s.w.id, +b.dataset.gg); addXP(2, b); g.innerHTML = `<div class="note gold">${+b.dataset.gg ? 'The star brightens — next check in ' + fmtIv(S.cards[s.w.id].s) + '.' : 'Rescheduled to come back within the hour.'}</div>`; });
  };
};

/* ================= BOOT ================= */
window.addEventListener('hashchange', route);

document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a && a.getAttribute('href') === (location.hash || '#home')) { e.preventDefault(); route(); }
});
window.addEventListener('error', e => console.error('Sprachwerk error:', e.message));
Voice.init();
Ear.init();
refreshShell();
route();
initCloud();
/* standalone website extras (only active in the Netlify build, which ships a manifest + service worker) */

if (!FRAMED && 'serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
}

})();
